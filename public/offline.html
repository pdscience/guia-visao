<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Guia Visão — Offline</title>
<meta name="description" content="Você está offline. O Guia Visão funciona com o modelo em cache assim que a conexão voltar.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07080d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.75rem;text-align:center}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.35em;color:#9DF53C;margin-bottom:.9rem}
  .badge{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.2em;color:#FFC53D;border:1px solid rgba(255,197,61,.4);border-radius:9999px;padding:.45rem 1rem;margin-bottom:1.25rem}
  h1{font-size:2.4rem;line-height:1;font-weight:900;letter-spacing:-.02em}
  h1 span{color:#9DF53C}
  p{margin-top:1.1rem;font-size:1rem;line-height:1.55;color:rgba(255,255,255,.6);max-width:26rem}
  p strong{color:#fff}
  button{margin-top:1.75rem;width:min(100%,22rem);height:3.75rem;border:0;border-radius:1rem;background:linear-gradient(135deg,#c6ff60,#8fe02c);color:#0b0e05;font-weight:900;font-size:1rem;cursor:pointer}
  button:active{transform:scale(.98)}
  .hint{margin-top:1rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.25em;color:rgba(255,255,255,.3)}
</style>
</head>
<body>
  <p class="mono">GUIA VISÃO · ASSISTENTE DE MOBILIDADE</p>
  <span class="badge">MODO OFFLINE</span>
  <h1>Enxergue<br>com o <span>som.</span></h1>
  <p>Você está sem conexão. A <strong>detecção usa o modelo em cache</strong> — volte para o app e continue com voz e vibração. Nenhuma imagem sai do aparelho.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
  <p class="hint">MODO OFFLINE — USANDO CACHE · NADA É ENVIADO</p>
</body>
</html>
